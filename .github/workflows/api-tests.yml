name: API Tests

on:
  push:
  workflow_dispatch:
  schedule:
    # Daily regression run at 06:00 UTC — catches drift independent of push activity,
    # e.g. if restful-booker's Docker image changes upstream, or one of the documented
    # test.fixme() defects gets silently fixed/regressed further.
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone restful-booker (API under test)
        run: git clone https://github.com/mwinteringham/restful-booker.git

      - name: Start restful-booker via Docker
        working-directory: restful-booker
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ping; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose -f restful-booker/docker-compose.yml logs
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser install needed: these are pure API tests using Playwright's
      # `request` fixture, which never launches a browser binary.

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down restful-booker
        if: always()
        working-directory: restful-booker
        run: docker compose down
